<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nomad Coffee — Specialty Coffee & Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --espresso: #2c1810;
      --cream: #f5f0e8;
      --caramel: #c8956c;
      --latte: #e8ddd0;
      --dark: #1a0f09;
      --text: #3d2b1f;
      --text-light: #7a6455;
      --white: #ffffff;
      --line: rgba(200, 149, 108, 0.16);
      --shadow-soft: 0 10px 30px rgba(44, 24, 16, 0.05);
      --shadow-card: 0 18px 48px rgba(44, 24, 16, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(245, 240, 232, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.65rem;
      color: var(--espresso);
      letter-spacing: -0.03em;
      line-height: 1;
      flex-shrink: 0;
    }

    .logo span {
      color: var(--caramel);
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 1.8rem;
    }

    .nav-links a {
      color: var(--text-light);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--espresso);
    }

    .nav-cta,
    .nav-cta:visited {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--espresso);
      color: var(--cream) !important;
      padding: 0.72rem 1.25rem;
      border-radius: 999px;
      font-size: 0.82rem !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase;
      border: 1px solid var(--espresso);
      transition: all 0.25s ease;
    }

    .nav-cta:hover {
      background: var(--caramel);
      border-color: var(--caramel);
      color: var(--dark) !important;
    }

    .menu-toggle {
      display: none;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
      color: var(--espresso);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }

    .menu-toggle span {
      width: 20px;
      height: 2px;
      background: currentColor;
      border-radius: 999px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .mobile-menu {
      display: none;
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 0 0 1rem;
    }

    .mobile-menu a:not(.mobile-cta) {
      display: block;
      padding: 0.95rem 0;
      color: var(--text);
      font-weight: 500;
      border-top: 1px solid rgba(200, 149, 108, 0.1);
    }

    .mobile-cta,
    .mobile-cta:visited {
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      margin-top: 0.8rem;
      background: var(--espresso);
      color: var(--cream);
      padding: 1rem 1.2rem;
      border-radius: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    body.menu-open .mobile-menu {
      display: block;
    }

    body.menu-open .menu-toggle span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    body.menu-open .menu-toggle span:nth-child(2) {
      opacity: 0;
    }

    body.menu-open .menu-toggle span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }
