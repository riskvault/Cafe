<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nomad Coffee — Specialty Coffee & Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --espresso: #2c1810;
      --cream: #f5f0e8;
      --caramel: #c8956c;
      --latte: #e8ddd0;
      --dark: #1a0f09;
      --text: #3d2b1f;
      --text-light: #7a6455;
      --white: #ffffff;
      --line: rgba(200, 149, 108, 0.16);
      --shadow-soft: 0 10px 30px rgba(44, 24, 16, 0.05);
      --shadow-card: 0 18px 48px rgba(44, 24, 16, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(245, 240, 232, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.65rem;
      color: var(--espresso);
      letter-spacing: -0.03em;
      line-height: 1;
      flex-shrink: 0;
    }

    .logo span {
      color: var(--caramel);
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 1.8rem;
    }

    .nav-links a {
      color: var(--text-light);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--espresso);
    }

    .nav-cta,
    .nav-cta:visited {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--espresso);
      color: var(--cream) !important;
      padding: 0.72rem 1.25rem;
      border-radius: 999px;
      font-size: 0.82rem !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase;
      border: 1px solid var(--espresso);
      transition: all 0.25s ease;
    }

    .nav-cta:hover {
      background: var(--caramel);
      border-color: var(--caramel);
      color: var(--dark) !important;
    }

    .menu-toggle {
      display: none;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
      color: var(--espresso);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }

    .menu-toggle span {
      width: 20px;
      height: 2px;
      background: currentColor;
      border-radius: 999px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .mobile-menu {
      display: none;
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 0 0 1rem;
    }

    .mobile-menu a:not(.mobile-cta) {
      display: block;
      padding: 0.95rem 0;
      color: var(--text);
      font-weight: 500;
      border-top: 1px solid rgba(200, 149, 108, 0.1);
    }

    .mobile-cta,
    .mobile-cta:visited {
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      margin-top: 0.8rem;
      background: var(--espresso);
      color: var(--cream);
      padding: 1rem 1.2rem;
      border-radius: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    body.menu-open .mobile-menu {
      display: block;
    }

    body.menu-open .menu-toggle span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    body.menu-open .menu-toggle span:nth-child(2) {
      opacity: 0;
    }

    body.menu-open .menu-toggle span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .hero {
      position: relative;
      padding: 8.5rem 0 4.5rem;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -160px;
      right: -120px;
      width: 540px;
      height: 540px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 149, 108, 0.18) 0%, rgba(200, 149, 108, 0) 70%);
      pointer-events: none;
    }

    .hero-content {
      width: min(1200px, calc(100% - 3rem));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(340px, 0.95fr);
      gap: 4rem;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .hero-tag {
      display: inline-block;
      background: var(--espresso);
      color: var(--caramel);
      padding: 0.58rem 1rem;
      border-radius: 999px;
      margin-bottom: 1.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.9rem, 6vw, 4.8rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
      color: var(--espresso);
      margin-bottom: 1.4rem;
      max-width: 10ch;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--caramel);
    }

    .hero-desc {
      max-width: 500px;
      font-size: 1.08rem;
      line-height: 1.75;
      color: var(--text-light);
      font-weight: 400;
      margin-bottom: 2rem;
    }

    .hero-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
    }

    .btn-primary,
    .btn-primary:visited {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--caramel);
      color: var(--dark);
      border: 2px solid var(--caramel);
      border-radius: 999px;
      padding: 0.98rem 1.8rem;
      font-weight: 700;
      font-size: 0.96rem;
      letter-spacing: 0.01em;
      transition: all 0.25s ease;
    }

    .btn-primary:hover {
      background: var(--espresso);
      border-color: var(--espresso);
      color: var(--cream);
    }

    .btn-outline,
    .btn-outline:visited {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--espresso);
      border: 2px solid var(--espresso);
      border-radius: 999px;
      padding: 0.98rem 1.8rem;
      font-weight: 600;
      font-size: 0.96rem;
      transition: all 0.25s ease;
    }

    .btn-outline:hover {
      background: var(--espresso);
      color: var(--cream);
    }

    .hero-visual {
      position: relative;
      min-height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-img {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4 / 5;
      border-radius: 220px 220px 28px 28px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.55), rgba(255,255,255,0) 28%),
        linear-gradient(145deg, #e7d8c8 0%, #d6b79d 55%, #c8956c 100%);
      box-shadow: 0 28px 70px rgba(44, 24, 16, 0.12);
      position: relative;
      overflow: hidden;
    }

    .hero-img::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(44,24,16,0.08), rgba(44,24,16,0)),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0) 30%);
    }

    .hero-badge {
      position: absolute;
      left: -1rem;
      bottom: 2rem;
      background: var(--white);
      color: var(--espresso);
      padding: 1.15rem 1.3rem;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(44, 24, 16, 0.14);
      border: 1px solid rgba(200, 149, 108, 0.12);
      min-width: 190px;
    }

    .hero-badge strong {
      display: block;
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      line-height: 1;
      color: var(--espresso);
      margin-bottom: 0.35rem;
    }

    .hero-badge span {
      display: block;
      color: var(--text-light);
      font-size: 0.92rem;
      line-height: 1.45;
      font-weight: 500;
    }

    .section-shell {
      padding: 6rem 0;
    }

    .section-tag {
      display: inline-block;
      color: var(--caramel);
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.95rem;
    }

    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: var(--espresso);
      margin-bottom: 3rem;
      max-width: 13ch;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.6rem;
    }

    .feature-card {
      background: var(--white);
      border: 1px solid rgba(200, 149, 108, 0.14);
      border-radius: 26px;
      padding: 2rem;
      box-shadow: var(--shadow-soft);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .feature-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-card);
      border-color: rgba(200, 149, 108, 0.28);
    }

    .feature-kicker {
      display: inline-block;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: var(--latte);
      color: var(--espresso);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .feature-card h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.45rem;
      line-height: 1.15;
      color: var(--espresso);
      margin-bottom: 0.85rem;
    }

    .feature-card p {
      color: var(--text-light);
      font-size: 0.98rem;
      line-height: 1.75;
      font-weight: 400;
    }

    .menu-section {
      background: var(--dark);
      color: var(--cream);
    }

    .menu-section .section-title {
      color: var(--cream);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: rgba(200, 149, 108, 0.12);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(200, 149, 108, 0.1);
    }

    .menu-item {
      background: var(--dark);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: start;
      padding: 1.9rem 2.1rem;
      transition: background 0.25s ease;
    }

    .menu-item:hover {
      background: rgba(200, 149, 108, 0.06);
    }

    .menu-copy {
      min-width: 0;
    }

    .menu-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.36rem;
      line-height: 1.12;
      color: var(--cream);
      margin-bottom: 0.32rem;
    }

    .menu-desc {
      color: rgba(245, 240, 232, 0.72);
      font-size: 0.95rem;
      line-height: 1.55;
      font-weight: 400;
    }

    .menu-price {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      line-height: 1;
      color: var(--caramel);
      white-space: nowrap;
      margin-left: 1rem;
      align-self: center;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.8rem;
    }

    .info-card {
      background: var(--white);
      border: 1px solid rgba(200, 149, 108, 0.14);
      border-radius: 28px;
      padding: 2.4rem;
      box-shadow: var(--shadow-soft);
    }

    .info-card .section-title {
      margin-bottom: 1.4rem;
      max-width: none;
    }

    .hours-list {
      list-style: none;
      margin-top: 1rem;
    }

    .hours-list li {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) minmax(140px, 1fr);
      gap: 1rem;
      align-items: start;
      padding: 0.95rem 0;
      border-bottom: 1px solid var(--latte);
    }

    .hours-list li:last-child {
      border-bottom: none;
    }

    .hours-day {
      color: var(--espresso);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.45;
    }

    .hours-time {
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.45;
      text-align: left;
    }

    .location-addr {
      margin-top: 0.35rem;
      color: var(--text-light);
      font-size: 1.06rem;
      line-height: 1.85;
      font-weight: 400;
    }

    .location-addr strong {
      color: var(--espresso);
      font-weight: 700;
    }

    .map-placeholder {
      margin-top: 1.5rem;
      min-height: 190px;
      border-radius: 20px;
      border: 1px solid rgba(200, 149, 108, 0.14);
      background:
        linear-gradient(rgba(245, 240, 232, 0.78), rgba(245, 240, 232, 0.78)),
        linear-gradient(135deg, #e5d7c7 0%, #f7efe5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.2rem;
      color: var(--text-light);
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }
